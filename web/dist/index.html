<!DOCTYPE html>
<html lang="zh-CN" data-kd-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Gateway</title>
<!-- 内联 SVG 图标：避免浏览器去请求 /favicon.ico（服务端只发 web 目录里的文件，
     那条请求必然 404，控制台里每次都多一条红字，排查真问题时要多看一行）。 -->
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='13' fill='%232572E6'/%3E%3Ccircle cx='16' cy='16' r='5' fill='%23fff'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/kd-design-system.css">
<link rel="stylesheet" href="/app.css">
</head>
<body>
<!-- 标题栏由 C# 侧 TitleBarPanel 绘制（见 shell/TitleBar.cs）。
     这里不再放 HTML 标题栏：WebView2 的子窗口铺满自己的区域，
     HTML 版会把这块像素吃掉，导致原生标题栏的鼠标事件到不了 Form。 -->

<div class="shell">
  <nav class="sidebar" id="sidebar">
    <div class="nav-scroll">
    <div class="nav-group">
      <div class="nav-group-label">工作台</div>
      <a class="nav-item active" data-page="overview">
        <svg viewBox="0 0 16 16" width="15" height="15"><rect x="2" y="2" width="5" height="5" rx="1" fill="none" stroke="currentColor" stroke-width="1.3"/><rect x="9" y="2" width="5" height="5" rx="1" fill="none" stroke="currentColor" stroke-width="1.3"/><rect x="2" y="9" width="5" height="5" rx="1" fill="none" stroke="currentColor" stroke-width="1.3"/><rect x="9" y="9" width="5" height="5" rx="1" fill="none" stroke="currentColor" stroke-width="1.3"/></svg>
        <span>概览</span>
      </a>
      <a class="nav-item" data-page="logs">
        <svg viewBox="0 0 16 16" width="15" height="15"><path d="M3 3h10M3 8h10M3 13h7" stroke="currentColor" stroke-width="1.3" fill="none" stroke-linecap="round"/></svg>
        <span>运行日志</span>
      </a>
    </div>
    <div class="nav-group">
      <div class="nav-group-label">配置</div>
      <a class="nav-item" data-page="providers">
        <svg viewBox="0 0 16 16" width="15" height="15"><circle cx="8" cy="5" r="2.6" fill="none" stroke="currentColor" stroke-width="1.3"/><path d="M2.8 13c0-2.6 2.3-4.2 5.2-4.2S13.2 10.4 13.2 13" fill="none" stroke="currentColor" stroke-width="1.3"/></svg>
        <span>供应商</span>
      </a>
      <a class="nav-item" data-page="accounts">
        <svg viewBox="0 0 16 16" width="15" height="15"><rect x="2" y="4" width="12" height="8.5" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.3"/><circle cx="5.6" cy="8" r="1.5" fill="currentColor"/><path d="M8.5 7h3.4M8.5 9.2h2.2" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/></svg>
        <span>账号</span>
      </a>
      <a class="nav-item" data-page="models">
        <svg viewBox="0 0 16 16" width="15" height="15"><path d="M8 2l5.5 3v6L8 14 2.5 11V5z" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/><path d="M8 8l5.5-3M8 8v6M8 8L2.5 5" stroke="currentColor" stroke-width="1" fill="none"/></svg>
        <span>模型目录</span>
      </a>
      <a class="nav-item" data-page="smartRoute">
        <svg viewBox="0 0 16 16" width="15" height="15"><path d="M2 8h4l2-4 2 8 2-4h2" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round" stroke-linecap="round"/></svg>
        <span>智能路由</span>
      </a>
      <a class="nav-item" data-page="groups">
        <svg viewBox="0 0 16 16" width="15" height="15"><rect x="2" y="2.5" width="5.4" height="4.4" rx="1.2" fill="none" stroke="currentColor" stroke-width="1.2"/><rect x="8.6" y="2.5" width="5.4" height="4.4" rx="1.2" fill="none" stroke="currentColor" stroke-width="1.2"/><rect x="2" y="9.1" width="5.4" height="4.4" rx="1.2" fill="none" stroke="currentColor" stroke-width="1.2"/><path d="M8.6 11.3h5.4M11.3 8.9v4.8" stroke="currentColor" stroke-width="1.2" fill="none" stroke-linecap="round"/></svg>
        <span>路由组</span>
      </a>
      <a class="nav-item" data-page="gateway">
        <svg viewBox="0 0 16 16" width="15" height="15"><circle cx="8" cy="8" r="6" fill="none" stroke="currentColor" stroke-width="1.3"/><path d="M2 8h12M8 2c2 2.4 2 9.6 0 12M8 2c-2 2.4-2 9.6 0 12" fill="none" stroke="currentColor" stroke-width="1.1"/></svg>
        <span>网关设置</span>
      </a>
      <a class="nav-item" data-page="keys">
        <svg viewBox="0 0 16 16" width="15" height="15"><circle cx="5.5" cy="8" r="2.6" fill="none" stroke="currentColor" stroke-width="1.3"/><path d="M8 8h6M11.5 8v2.6M13.6 8v1.8" stroke="currentColor" stroke-width="1.3" fill="none" stroke-linecap="round"/></svg>
        <span>客户端密钥</span>
      </a>
      <a class="nav-item" data-page="calls">
        <svg viewBox="0 0 16 16" width="15" height="15"><path d="M2 11l3.4-4 2.8 2.4L13 3.5" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round" stroke-linecap="round"/><path d="M2 13.5h12" stroke="currentColor" stroke-width="1.2" opacity="0.5"/></svg>
        <span>调用记录</span>
      </a>
    </div>
    <div class="nav-group">
      <div class="nav-group-label">进阶</div>
      <a class="nav-item" data-page="strategy">
        <svg viewBox="0 0 16 16" width="15" height="15"><circle cx="8" cy="8" r="5.6" fill="none" stroke="currentColor" stroke-width="1.3"/><path d="M8 4.6v3.6l2.4 1.5" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>
        <span>高级策略</span>
      </a>
      <a class="nav-item" data-page="backup">
        <svg viewBox="0 0 16 16" width="15" height="15"><path d="M8 2.4v8" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/><path d="M5 7.6L8 10.6l3-3" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/><path d="M3 12.6h10" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>
        <span>备份与恢复</span>
      </a>
    </div>
    </div>
    <div class="sidebar-foot">
      <div class="base-url" id="sidebarUrl">—</div>
      <div class="base-url-hint">客户端接入地址</div>
      <div class="inst-badge" id="instBadge" hidden title=""></div>
    </div>
  </nav>

  <main class="content">
    <div class="page-head">
      <div>
        <h1 id="pageTitle">概览</h1>
        <p id="pageSubtitle">本地网关运行状态</p>
      </div>
      <div class="page-head-actions" id="pageActions"></div>
    </div>
    <div class="page-body" id="pageBody"></div>
  </main>
</div>

<!-- 通用弹窗：不用原生 alert/confirm（WebView2 里那套样式不可控且阻塞） -->
<div class="modal-mask" id="modalMask" hidden>
  <div class="modal">
    <div class="modal-head"><h2 id="modalTitle">提示</h2></div>
    <div class="modal-body" id="modalBody"></div>
    <div class="modal-foot" id="modalFoot"></div>
  </div>
</div>

<div class="toast-stack" id="toasts"></div>

<script src="/app.js"></script>
</body>
</html>
